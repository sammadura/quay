<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07080c" />
  <title>Quay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307080c' width='32' height='32'/%3E%3Crect x='14' y='6' width='4' height='14' fill='%23322a1a'/%3E%3Ccircle cx='16' cy='8' r='5' fill='%23e4b44a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>

  <div id="hud" hidden>
    <div id="place">Quay</div>
    <div id="hint">WASD walk · mouse look · arrows turn</div>
  </div>

  <div id="pad" hidden>
    <button type="button" data-dir="n" aria-label="forward">▲</button>
    <button type="button" data-dir="w" aria-label="left">◀</button>
    <button type="button" data-dir="s" aria-label="back">▼</button>
    <button type="button" data-dir="e" aria-label="right">▶</button>
  </div>
  <div id="look-hint" hidden>drag to look</div>

  <div id="gate">
    <div class="gate-inner">
      <p class="kicker">night harbor</p>
      <h1>Quay</h1>
      <p class="line">lanterns over wet cobble</p>
      <button type="button" id="enter">Walk</button>
    </div>
  </div>

  <script src="world.js"></script>
  <script src="input.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
